# Development override: eksplisit dijalankan via
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml --env-file .env.docker up -d --build
services:
  postgres:
    ports:
      - "55433:5432"
    networks:
      - fronted
      - internal
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cashflow

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
      args:
        NODE_ENV: development
    environment:
      NODE_ENV: development
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    volumes:
      - ../apps/backend:/app/apps/backend:cached
      - ../prisma:/app/prisma:cached
      - ../prisma.config.ts:/app/prisma.config.ts:ro
      - ./backend/entrypoint.sh:/app/entrypoint.sh:ro
      - /app/node_modules
    ports:
      - "3001:3001"
    command: ["npm", "--prefix", "/app/apps/backend", "run", "start:dev"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
      args:
        NODE_ENV: development
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_DEMO_DATA_MODE: ${NEXT_PUBLIC_DEMO_DATA_MODE:-false}
    volumes:
      - ../apps/frontend:/app/apps/frontend:cached
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT}:3000"
    command: ["npm", "run", "dev", "-w", "frontend", "--", "--webpack"]
    depends_on:
      backend:
        condition: service_healthy
