services:
  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
      args:
        NODE_ENV: development
    environment:
      NODE_ENV: development
    volumes:
      - ../apps/backend:/usr/src/app:cached
      - /usr/src/app/node_modules
    ports:
      - "3001:3001"
    command: ["npm", "run", "start:dev"]
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
      args:
        NODE_ENV: development
    environment:
      NODE_ENV: development
    volumes:
      - ../apps/frontend:/usr/src/app:cached
      - /usr/src/app/node_modules
    ports:
      - "3000:3000"
    command: ["npm", "run", "dev"]
    depends_on:
      - backend

  nginx:
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro