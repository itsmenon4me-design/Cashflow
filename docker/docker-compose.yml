# ============================================================
# CashFlow Docker Compose
#
# PRODUCTION:
#   CASHFLOW_ENV_FILE=<pathToRealEnv> \
#     docker compose -f docker-compose.yml --env-file <pathToRealEnv> up -d --build
#   Example:
#     CASHFLOW_ENV_FILE=.env docker compose -f docker-compose.yml --env-file .env up -d --build
#
#   DEVELOPMENT:
#     docker compose -f docker-compose.yml -f docker-compose.dev.yml --env-file .env.docker up -d --build
#
# Postgres/Redis/MinIO live on an internal network (no host ports).
# Public entry point is Nginx on :80 (TLS terminates at Cloudflare).
# ============================================================

services:
  postgres:
    image: postgres:15
    container_name: ${COMPOSE_PROJECT_NAME:-cashflow}_postgres
    restart: unless-stopped
    env_file:
      - "${CASHFLOW_ENV_FILE:-.env.docker}"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-cashflow}_redis
    restart: unless-stopped
    env_file:
      - "${CASHFLOW_ENV_FILE:-.env.docker}"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test:
        - CMD-SHELL
        - if [ -n "$${REDIS_PASSWORD}" ]; then redis-cli -a "$${REDIS_PASSWORD}" ping; else redis-cli ping; fi | grep PONG || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: ${COMPOSE_PROJECT_NAME:-cashflow}_minio
    restart: unless-stopped
    env_file:
      - "${CASHFLOW_ENV_FILE:-.env.docker}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "(curl -f http://localhost:9000/minio/health/ready || exit 1)"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
      args:
        NODE_ENV: production
    container_name: ${COMPOSE_PROJECT_NAME:-cashflow}_backend
    restart: always
    env_file:
      - "${CASHFLOW_ENV_FILE:-.env.docker}"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      SEED_ENABLED: ${SEED_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
      - fronted
    ports:
      - "3001:3001"
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -f http://localhost:3001/${API_PREFIX}/${API_VERSION}/health || exit 1"
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
      args:
        NODE_ENV: production
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: ${COMPOSE_PROJECT_NAME:-cashflow}_frontend
    restart: always
    env_file:
      - "${CASHFLOW_ENV_FILE:-.env.docker}"
    environment:
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - fronted
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q -O - http://localhost:3000 || exit 1"
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:stable-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-cashflow}_nginx
    restart: always
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    networks:
      - fronted
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  internal:
    driver: bridge
    internal: true
  fronted:
    driver: bridge