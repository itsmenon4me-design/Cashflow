# Local runtime verification override (avoid host port conflicts with dev stack)
#   CASHFLOW_ENV_FILE=.env.verify docker compose \
#     -f docker-compose.yml -f docker-compose.verify.yml --env-file .env.verify up -d --build

services:
  backend:
    ports:
      - "3101:3001"

  frontend:
    ports:
      - "3100:3000"

  nginx:
    ports:
      - "8080:80"

  postgres:
    ports:
      - "5433:5432"
    networks:
      - fronted
      - internal

  redis:
    ports:
      - "6379:6379"
    networks:
      - fronted
      - internal